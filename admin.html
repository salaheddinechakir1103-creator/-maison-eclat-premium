<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الحجوزات | Maison Éclat</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#302524;font-family:Tahoma,Arial,sans-serif}header{background:#302524;color:white;padding:24px 6%;display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0}a{color:inherit}main{max-width:1150px;margin:40px auto;padding:0 18px}.panel{background:white;padding:24px;border:1px solid #e7dbd0;border-radius:10px;margin-bottom:20px}input,button,select{font:inherit;padding:11px;border:1px solid #d4c6ba;border-radius:6px}button{background:#93465b;color:white;cursor:pointer;border:0}input{width:min(360px,100%)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:24px;background:white;border:1px solid #e7dbd0;border-radius:9px}.stat strong{font-size:31px;display:block;color:#93465b}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:13px;text-align:right;border-bottom:1px solid #eee3dc;font-size:14px}th{background:#f8f0eb}.scroll{overflow-x:auto}.muted{color:#7d6b64}.error{color:#b52240}.hide{display:none}@media(max-width:600px){.stats{grid-template-columns:1fr}header h1{font-size:19px}}</style></head><body><header><h1>MAISON ÉCLAT · لوحة الحجوزات</h1><a href="/">الرجوع للموقع ↗</a></header><main><section class="panel"><h2>دخول الإدارة</h2><p class="muted">دخل رمز الإدارة الخاص بك. ما تشاركوش مع حتى واحد.</p><div class="row"><input id="secret" type="password" placeholder="رمز الإدارة" autocomplete="off"><button id="load">عرض الحجوزات</button><button id="logout" style="background:#655753">خروج</button></div><p id="message" class="muted"></p></section><section id="dashboard" class="hide"><div class="stats"><div class="stat">مجموع الحجوزات<strong id="total">0</strong></div><div class="stat">كتسنى التأكيد<strong id="pending">0</strong></div><div class="stat">مؤكدة<strong id="confirmed">0</strong></div></div><section class="panel" style="margin-top:20px"><div class="row" style="justify-content:space-between"><h2>الطلبات</h2><button id="refresh">تحديث ↻</button></div><div class="scroll"><table><thead><tr><th>رقم التذكرة</th><th>الزبونة</th><th>الهاتف</th><th>الخدمة</th><th>الثمن</th><th>النهار</th><th>الوقت</th><th>الحالة</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><script>
let key='';const $=id=>document.getElementById(id);const statuses={pending:'كتسنى التأكيد',confirmed:'مؤكد',cancelled:'ملغي',completed:'مكتمل'};function td(tr,value){const c=document.createElement('td');c.textContent=value;tr.append(c);return c}async function load(){key=$('secret').value.trim();if(!key){$('message').textContent='دخل رمز الإدارة';return}try{const r=await fetch('/api/bookings',{headers:{'x-admin-secret':key}});const d=await r.json();if(!r.ok)throw Error(d.error||'خطأ');$('message').textContent='';$('dashboard').classList.remove('hide');$('rows').replaceChildren();$('total').textContent=d.bookings.length;$('pending').textContent=d.bookings.filter(x=>x.status==='pending').length;$('confirmed').textContent=d.bookings.filter(x=>x.status==='confirmed').length;for(const b of d.bookings){const tr=document.createElement('tr');for(const v of [b.id,b.name,b.phone,b.service,b.price+' درهم',b.date,b.time])td(tr,v);const cell=document.createElement('td');const sel=document.createElement('select');for(const [value,label] of Object.entries(statuses)){const opt=document.createElement('option');opt.value=value;opt.textContent=label;sel.append(opt)}sel.value=b.status;sel.onchange=async()=>{const resp=await fetch('/api/bookings',{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-secret':key},body:JSON.stringify({id:b.id,status:sel.value})});if(!resp.ok)alert('ما قدرناش نبدلو الحالة');await load()};cell.append(sel);tr.append(cell);$('rows').append(tr)}}catch(e){$('dashboard').classList.add('hide');$('message').textContent=e.message;$('message').className='error'}}$('load').onclick=load;$('refresh').onclick=load;$('logout').onclick=()=>{key='';$('secret').value='';$('dashboard').classList.add('hide');$('message').textContent='خرجتي من الإدارة'};</script></body></html>
